kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devsecops
networking:
  # kind's default CNI (kindnet) does NOT enforce NetworkPolicy, so it is
  # disabled and Calico is installed instead (see scripts/bootstrap.sh).
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
