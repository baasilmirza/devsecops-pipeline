# SOPS configuration for this repo.
#
# Encrypt only the values, never the keys, so the file stays reviewable:
#   sops --encrypt secrets/app-secret.sops.yaml > /tmp/out && mv /tmp/out ...
#
# 1. Generate an age key:  age-keygen -o age.key
# 2. Put the PUBLIC key below (age1...). Keep age.key OUT of git (.gitignore).
creation_rules:
  - path_regex: secrets/.*\.sops\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
