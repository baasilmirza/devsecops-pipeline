apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow mutable image tags
    policies.kyverno.io/severity: medium
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/description: >-
      Mutable tags such as 'latest' make deployments non-reproducible and hide
      which image is actually running. An explicit, immutable tag is required.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - portfolio
      validate:
        message: "An explicit image tag is required (e.g. myimage:1.2.3)."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - portfolio
      validate:
        message: "Using the mutable 'latest' tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
